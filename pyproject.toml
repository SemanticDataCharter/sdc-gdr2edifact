[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdc-gdr2edifact"
version = "4.0.2"
description = "Governed Data Records as conformant UN/EDIFACT D.24A interchanges, through sdc-mapper: one mapping file per model, every value reported."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Axius SDC, Inc." }]
keywords = ["sdc", "semantic data charter", "governed data record", "edifact", "un/edifact", "unece", "mapping"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "sdc-mapper>=4.3,<5",     # placements, joins, cluster order (4.2.0); join_depth, LOOKUP_TRANSFORMS (4.3.0)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyyaml>=6.0", "lxml>=5.0", "pydifact>=0.2"]

[project.entry-points."sdc_mapper.targets"]
edifact = "sdc_gdr2edifact:EDIFACTMapper"

[project.urls]
Repository = "https://github.com/SemanticDataCharter/sdc-gdr2edifact"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdc_gdr2edifact = ["mappings/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
