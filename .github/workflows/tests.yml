name: tests
# Offline on every pull request and on main. The UN/EDIFACT directory is not in this repository (UNECE's license
# allows copies within the organization): the tests read it from the private SemanticDataCharter/unedifact-directory,
# checked out with a read-only token (the UNEDIFACT_DIRECTORY_READ secret).
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: SemanticDataCharter/unedifact-directory
          path: unedifact-directory
          token: ${{ secrets.UNEDIFACT_DIRECTORY_READ }}
      - run: cd unedifact-directory && sha256sum -c SHA256SUMS
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests -q -p no:warnings
        env:
          SDC_EDIFACT_DIRECTORY: ${{ github.workspace }}/unedifact-directory/d24a.zip
